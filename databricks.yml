# This is a Databricks asset bundle definition for ilec_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ilec_pipeline
  uuid: e4421f05-cd4e-4791-8aa3-fd99608adc75

include:
  - resources/*.yml

artifacts:
  lib_wheel:
    type: whl
    path: .
    build: python -m hatchling build -t wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ae46c4db-6174.cloud.databricks.com
    presets:
      pipelines_development: false
    variables:
      catalog: workspace
      schema: mlops_dev
  prod:
    mode: production
    workspace:
      host: https://dbc-ae46c4db-6174.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mr.anderson.1725@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mr.anderson.1725@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: mlops_prod
    permissions:
      - user_name: mr.anderson.1725@gmail.com
        level: CAN_MANAGE
