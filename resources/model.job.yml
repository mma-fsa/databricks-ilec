# A sample job for ilec_pipeline.

resources:
  jobs:
    train_model:
      name: train_model

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/model/model_glm.py

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - xgboost==3.2.0
              - scikit-learn==1.8
