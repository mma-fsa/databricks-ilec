# Build the src/lib wheel via the Databricks bundle artifact, then run a wheel task from that artifact.

resources:
  jobs:
    build_lib_wheel:
      name: build_lib_wheel

      tasks:
        - task_key: build_lib_wheel
          python_wheel_task:
            package_name: ilec_pipeline
            entry_point: build_lib_wheel
          libraries:
            - whl: ../dist/*.whl