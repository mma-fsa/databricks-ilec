# The main pipeline for ilec_pipeline

resources:
  pipelines:
    ilec_pipeline_etl:
      name: ilec_pipeline_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/pipeline"

      libraries:
        - glob:
            include: ../src/pipeline/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
